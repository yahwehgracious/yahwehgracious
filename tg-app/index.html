<div class="sh">Чекають рішення</div><div class="sec">${D.actions.filter(a=>a.kind!=='alert_fatigue').map(actRow).join('')||'<div class="row"><div class="t">Нічого — все в межах цілей</div></div>'}</div>
<div class="sh">Конкуренти</div><div class="sec"><div class="row" data-tab="comp"><div class="ic i-blue">⌕</div><div class="t"><b>${D.stats.winners} креативів у ротації ≥${D.min_days} дн</b><small>${D.stats.advertisers} забудовників · рекорд ${D.stats.max_days} дн</small></div><span class="chev"></span></div>
<div class="row" data-tab="briefs"><div class="ic i-blue">✎</div><div class="t"><b>${D.concepts.length} нових концептів</b><small>сценарії, хуки, тексти</small></div><span class="chev"></span></div></div>
<div class="note">${esc(D.models)}</div>`;

/* ---------- дії */
VIEWS.acts=()=>`<div class="h1">Дії</div><div class="sub">Правила + запобіжники. Без твого рішення нічого не змінюється.</div>
<div class="sec">${D.actions.map(actRow).join('')}</div>`;
const actView=id=>()=>{const a=D.actions.find(x=>x.id==id);const ad=D.ads.find(x=>x.ad_id===a.ad_id)||{};
 const c={pause_ad:'i-red',scale_adset:'i-green',alert_fatigue:'i-amber'}[a.kind];
 return `<div class="card"><div class="row" style="padding:0;border:0;cursor:default"><div class="ic ${c}">${a.kind==='pause_ad'?'⏸':a.kind==='scale_adset'?'↗':'!'}</div><div class="t"><b>${esc(a.label)}</b><small>${esc(a.ad_name)}</small></div></div>
 <div class="lbl">Чому</div><div class="txt">${esc(a.reason)}</div>
 ${ad.ad_id?`<div class="stat"><div><span>CPL 7д</span><b>${money(ad.cpl_7d)}</b></div><div><span>Ціна кваліф. ліда</span><b>${money(ad.cql_7d)}</b></div><div><span>Кваліфіковані</span><b>${pct(ad.q_rate)}</b></div><div><span>Витрати 7д</span><b>${money(ad.spend_7d)}</b></div></div>
 <div class="fig"><svg data-ad="${ad.ad_id}"></svg></div>`:''}
 ${a.kind==='alert_fatigue'?'':done[a.id]?`<div class="note">${done[a.id]==='ok'?'✅ Відправлено на виконання':'❌ Відхилено'}</div>`:
 `<div class="btns"><button class="btn pri" data-dec="ok" data-id="${a.id}">${a.kind==='scale_adset'?'Масштабувати +20%':'Вимкнути'}</button><button class="btn" data-dec="no" data-id="${a.id}">Відхилити</button></div>`}</div>`};

/* ---------- наша реклама */
const mark=s=>s.leads_7d===0&&s.spend_7d>0||s.cql_7d>K.target_cql*1.5?'d-red':s.cql_7d&&s.cql_7d<=K.target_cql?'d-green':s.age_h<72?'d-grey':'d-amber';
VIEWS.ads=()=>{const rows=[...D.ads].sort((a,b)=>(a.cql_7d??a.cpl_7d??1e9)-(b.cql_7d??b.cpl_7d??1e9));
 return `<div class="h1">Наша реклама</div><div class="sub">7 днів · від найдешевшого кваліфікованого ліда</div>
 <div class="sec">${rows.map(s=>`<div class="row" data-ad="${s.ad_id}"><span class="dot ${mark(s)}"></span><div class="t"><b>${esc(s.name)}</b><small>${money(s.spend_7d)} · ${s.leads_7d} лідів · кваліф. ${pct(s.q_rate)}</small></div><div class="v">${money(s.cql_7d??s.cpl_7d)}<small>${s.cql_7d!=null?'за кваліф.':'CPL'}</small></div><span class="chev"></span></div>`).join('')}</div>
 <div class="note">🟢 у цілі · 🔴 треба діяти · ⚪ навчання</div>`};
const adView=id=>()=>{const s=D.ads.find(x=>x.ad_id===id);const acts=D.actions.filter(a=>a.ad_id===id);
 const tr=s.trend==null?'':` (${s.trend>0?'+':''}${s.trend}% т/т)`;
 return `<div class="card"><h3>${esc(s.name)}</h3><div class="sub" style="margin:0">${Math.round(s.age_h/24)} дн у роботі</div>
 <div class="fig"><svg data-ad="${s.ad_id}"></svg></div><div class="note" style="margin:4px 0 0">стовпчики — витрати, лінія — ліди, 14 днів</div>
 <div class="stat"><div><span>Витрати 7д</span><b>${money(s.spend_7d)}</b></div><div><span>Ліди</span><b>${s.leads_7d}</b></div>
 <div><span>CPL</span><b>${money(s.cpl_7d)}</b><span>${esc(tr)}</span></div><div><span>Ціна кваліф. ліда</span><b>${money(s.cql_7d)}</b></div>
 <div><span>Кваліфіковані</span><b>${pct(s.q_rate)}</b><span>${s.q_qualified} з ${s.q_leads}</span></div><div><span>Hook / hold</span><b>${pct(s.hook_rate)} / ${pct(s.hold_rate)}</b></div>
 <div><span>CTR</span><b>${pct(s.ctr_7d)}</b><span>на старті ${pct(s.ctr_first)}</span></div><div><span>Частота</span><b>${s.freq_7d}</b></div></div></div>
 ${acts.length?`<div class="sh">Рекомендація</div><div class="sec">${acts.map(actRow).join('')}</div>`:''}`};

/* ---------- конкуренти */
let filt=null;
VIEWS.comp=()=>{const P=D.patterns;const chips=[...(P.hook||[]).map(x=>['hook',...x]),...(P.offer||[]).map(x=>['offer',...x]),...(P.angle||[]).map(x=>['angle',...x])];
 const list=D.winners.filter(w=>{if(!filt)return true;const[k,v]=filt;const x=w.a?.[k];return (typeof x==='object'?x?.type:x)===v});
 return `<div class="h1">Конкуренти</div><div class="sub">${D.stats.ads_total} оголошень · ${D.stats.advertisers} забудовників · у ротації ≥${D.min_days} дн: ${D.stats.winners}</div>
 <div class="chips"><button class="chip ${filt?'':'on'}" data-f="">Усі</button>${chips.map(([k,v,n])=>`<button class="chip ${filt&&filt[0]===k&&filt[1]===v?'on':''}" data-f="${k}|${esc(v)}">${esc(v)} · ${n}</button>`).join('')}</div>
 <div class="sec">${list.map(w=>{const i=D.winners.indexOf(w);const h=w.a?.hook||{};return `<div class="row" data-comp="${i}"><div class="t"><b>${esc(w.page_name)}</b><small>${esc(h.type)} · ${esc((w.a?.offer||{}).type)}</small></div><div class="v">${w.days} дн<small>×${w.variants}</small></div><span class="chev"></span></div>`}).join('')||'<div class="row"><div class="t">Нічого під фільтр</div></div>'}</div>`};
const compView=i=>()=>{const w=D.winners[i],a=w.a||{},h=a.hook||{},o=a.offer||{};
 return `<div class="card"><h3>${esc(w.page_name)}</h3><div>${[`${w.days} дн у ротації`,`×${w.variants} копій`,w.reuse&&'повторний запуск',w.survived_refresh&&'пережив оновлення',w.impr_rank!=null&&`#${w.impr_rank+1} за показами`].filter(Boolean).map(t=>`<span class="pill">${t}</span>`).join('')}</div>
 <div class="lbl">🪝 Хук · ${esc(h.type)}</div><div class="txt">${esc(h.text||w.text||w.title)}</div>
 <div class="lbl">🎁 Офер · ${esc(o.type)}</div><div class="txt">${esc(o.details)}</div>
 <div class="lbl">🎯 Кут і персона</div><div class="txt">${esc(a.angle)} · ${esc(a.persona)}</div>
 <div class="lbl">Чому працює</div><div class="txt">${esc(a.why_works)}</div>
 <div class="lbl">Взяти собі</div><div class="txt"><b>${esc(a.steal_this)}</b></div>
 ${w.text_source!=='body'?'<div class="note">текст лише із заголовка — візуал дивись в Ad Library</div>':''}
 <div class="btns"><button class="btn pri wide" data-url="${esc(w.snapshot_url)}">Відкрити в Ad Library</button></div></div>`};

/* ---------- брифи */
VIEWS.briefs=()=>`<div class="h1">Брифи</div><div class="sub">${D.concepts.length} концептів · кожен — інша персона, кут і формат</div>
<div class="sec">${D.concepts.map((c,i)=>`<div class="row" data-brief="${i}"><div class="ic i-blue">${i+1}</div><div class="t"><b>${esc(c.concept)}</b><small>${esc(c.persona)} · ${esc((c.format||'').split(',')[0])}</small></div><span class="chev"></span></div>`).join('')}</div>`;
let bt='overview';
const briefView=i=>()=>{const c=D.concepts[i];const tabs=[['overview','Суть'],['hooks','Хуки'],['script','Сценарій'],['text','Текст']];
 const body={overview:`<div class="lbl">👤 Персона</div><div class="txt">${esc(c.persona)}</div><div class="lbl">🎯 Кут</div><div class="txt">${esc(c.angle)} · ${esc(c.awareness)}</div>
  <div class="lbl">🎞 Формат</div><div class="txt">${esc(c.format)}</div><div class="lbl">🎁 Офер</div><div class="txt">${esc(c.offer)}</div>
  <div class="lbl">Гіпотеза</div><div class="txt">${esc(c.hypothesis)}</div><div class="lbl">✅ Критерій успіху</div><div class="txt">${esc(c.success)}</div>`,
  hooks:(c.hooks||[]).map((h,n)=>`<div class="step"><div class="tc">#${n+1}</div><div>${esc(h)}</div></div>`).join(''),
  script:(c.script||[]).map(s=>`<div class="step"><div class="tc">${esc(s.t)}</div><div>${esc(s.frame)}<small>Текст: «${esc(s.on_screen)}»</small>${s.voice&&s.voice!=='—'?`<small>Голос: «${esc(s.voice)}»</small>`:''}</div></div>`).join('')+(c.production?`<div class="lbl">Продакшн</div><div class="txt">${esc(c.production)}</div>`:''),
  text:`<div class="lbl">Текст оголошення</div><div class="copy">${esc(c.primary_text)}</div><div class="lbl">Заголовок</div><div class="copy">${esc(c.headline)}</div>
  ${c.lead_form?`<div class="lbl">Заявка · ${esc(c.lead_form.type)}</div>${(c.lead_form.questions||[]).map(q=>`<div class="txt">• ${esc(q)}</div>`).join('')}`:''}
  <div class="btns"><button class="btn pri wide" data-copy="${i}">Скопіювати текст і заголовок</button></div>`}[bt];
 return `<div class="card"><h3>${i+1}. ${esc(c.concept)}</h3><div class="chips" style="margin-top:8px">${tabs.map(([k,l])=>`<button class="chip ${k===bt?'on':''}" data-bt="${k}">${l}</button>`).join('')}</div>${body}</div>`};

/* ---------- графік */
function drawCharts(){document.querySelectorAll('svg[data-ad]').forEach(s=>{const ser=D.series[s.dataset.ad]||[];const W=s.clientWidth,H=s.clientHeight;if(!W||!ser.length)return;
 const m={l:6,r:6,t:14,b:18},w=W-m.l-m.r,h=H-m.t-m.b,ms=Math.max(...ser.map(d=>d.spend),1),ml=Math.max(...ser.map(d=>d.leads),1),bw=w/ser.length;
 let g='';ser.forEach((d,i)=>{const bh=Math.max(2,d.spend/ms*h);g+=`<rect x="${m.l+i*bw+bw*.18}" y="${m.t+h-bh}" width="${bw*.64}" height="${bh}" rx="3" fill="var(--sep)"/>`});
 const pts=ser.map((d,i)=>[m.l+i*bw+bw/2,m.t+h-d.leads/ml*h*.9]);
 g+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.8" fill="var(--acc)"/>`).join('');
 g+=`<text x="${m.l}" y="10">до $${Math.round(ms)}/день</text><text x="${W-m.r}" y="10" text-anchor="end" fill="var(--acc)">до ${ml} лідів</text>`;
 g+=`<text x="${m.l}" y="${H-3}">${ser[0].day.slice(5).replace('-','.')}</text><text x="${W-m.r}" y="${H-3}" text-anchor="end">${ser.at(-1).day.slice(5).replace('-','.')}</text>`;
 s.innerHTML=g})}
new ResizeObserver(drawCharts).observe(document.body);

/* ---------- події */
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act],[data-ad],[data-comp],[data-brief],[data-tab],[data-f],[data-bt],[data-dec],[data-url],[data-copy]');if(!t)return;
 const d=t.dataset;
 if(d.tab){tab=d.tab;stack=[];render();hap();return}
 if(d.act){go(actView(d.act));return}
 if(d.ad&&t.classList.contains('row')){go(adView(d.ad));return}
 if(d.comp){go(compView(+d.comp));return}
 if(d.brief){bt='overview';go(briefView(+d.brief));return}
 if(d.f!==undefined){filt=d.f?d.f.split('|'):null;render();hap('soft');return}
 if(d.bt){bt=d.bt;stack[stack.length-1]=stack.at(-1);render();hap('soft');return}
 if(d.url){try{tg.openLink(d.url)}catch(err){window.open(d.url)}return}
 if(d.copy){const c=D.concepts[+d.copy];try{await navigator.clipboard.writeText(c.primary_text+'\n\n'+c.headline);toast('Скопійовано');hap('medium')}catch(err){toast('Виділи текст і скопіюй')}return}
 if(d.dec){const a=D.actions.find(x=>x.id==d.id);
  const go2=()=>{done[d.id]=d.dec;save();try{tg.HapticFeedback.notificationOccurred('success')}catch(err){}
   const url=`https://t.me/${D.bot}?start=${d.dec}_${D.slug}_${d.id}`;
   if(D.bot){try{tg.openTelegramLink(url)}catch(err){window.open(url)}}
   toast(d.dec==='ok'?'Відправлено боту на виконання':'Відхилено');render()};
  const q=d.dec==='ok'?(a.kind==='scale_adset'?'Підняти бюджет адсету на 20%?':'Вимкнути це оголошення?'):'Відхилити рекомендацію?';
  try{tg.showConfirm(q,ok=>{if(ok)go2()})}catch(err){go2()}}
});
render();
}</script></body></html>

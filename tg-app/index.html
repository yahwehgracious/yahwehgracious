<script>{

/* словник: [проста назва, термін таргетолога, пояснення] */

 spend:['Витрати','Spend','Скільки грошей Facebook та Instagram списали за показ реклами за останні 7 днів.'],

function charts(){document.querySelectorAll('svg[data-ad]').forEach(s=>{const ser=D.series[s.dataset.ad]||[];const W=s.clientWidth,H=s.clientHeight;if(!W||!ser.length)return;
 const m={l:4,r:4,t:24,b:20},w=W-m.l-m.r,h=H-m.t-m.b,ms=Math.max(...ser.map(d=>d.spend),1),ml=Math.max(...ser.map(d=>d.leads),1),bw=w/ser.length;
 let g='<defs><linearGradient id="bgr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".6"/><stop offset="1" stop-color="#8b5cf6" stop-opacity=".1"/></linearGradient><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".3"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient></defs>';
 ser.forEach((d,i)=>{const bh=Math.max(3,d.spend/ms*h);g+=`<rect class="bar" style="animation-delay:${i*40}ms" x="${(m.l+i*bw+bw*.18).toFixed(1)}" y="${(m.t+h-bh).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="url(#bgr)"/>`});
 const pts=ser.map((d,i)=>[m.l+i*bw+bw/2,m.t+h-d.leads/ml*h*.9]);let len=0;for(let i=1;i<pts.length;i++)len+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
 const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 if(pts.length>1)g+=`<path d="${path} L${pts.at(-1)[0].toFixed(1)} ${m.t+h} L${pts[0][0].toFixed(1)} ${m.t+h}Z" fill="url(#ar)" class="dp" style="animation-delay:1.4s"/>`;
 g+=`<path d="${path}" class="ln" style="--len:${Math.ceil(len)+2}" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
 g+=pts.map((p,i)=>`<circle class="dp" style="animation-delay:${350+i*90}ms" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.3" fill="#07070c" stroke="#22d3ee" stroke-width="2"/>`).join('');
 g+=`<text x="${m.l}" y="12">до ${usd(ms)} на день</text><text x="${W-m.r}" y="12" text-anchor="end" style="fill:#22d3ee">заявки: до ${ml} на день</text>`;
 const dd=x=>x.slice(8,10)+'.'+x.slice(5,7);
 g+=`<text x="${m.l}" y="${H-4}">${dd(ser[0].day)}</text><text x="${W-m.r}" y="${H-4}" text-anchor="end">${dd(ser.at(-1).day)}</text>`;
 s.innerHTML=g})}

/* події */
document.addEventListener('click',async e=>{const t=e.target.closest('[data-cr],[data-go],[data-tg],[data-open],[data-q],[data-how],[data-back],[data-replay],[data-tab2],[data-act],[data-adv],[data-comp],[data-idea],[data-iseg],[data-bt],[data-dec],[data-url],[data-copy]');if(!t)return;const d=t.dataset;
 if(d.cr){go(crView(+d.cr));return}
 if(d.go){const c=D.creatives.find(x=>x.id==d.go);const f=()=>{toast('Відкриваю бота…');setTimeout(()=>tgLink(`go_${D.slug}_${d.go}`),400)};if(tg?.initData&&tg.showConfirm)tg.showConfirm(`Запустити «${c.name}» у рекламу?`,ok=>{if(ok)f()});else f();return}
 if(d.tg){tgLink('');return}
 if(d.open){openUrl(d.open);return}
 if(d.q){e.stopPropagation();const g=G[d.q];sheet(`<h3>${g[0]} <span class="pro">${g[1]}</span></h3><div style="color:#c9c9d6;font-size:15px">${g[2]}</div><button class="btn ghost" data-x="1">Зрозуміло</button>`);return}
 if(d.how){go(howView);return}if(d.back){back();return}
 if(d.replay){ls.set('intro_seen_'+D.slug,'');location.reload();return}
 if(d.tab2){tab=d.tab2;stack=[];hap('soft');render();return}
 if(d.act){go(decView(d.act));return}
 if(d.adv){go(adView(d.adv));return}
 if(d.comp){go(compView(+d.comp));return}
 if(d.idea){bt='sum';go(ideaView(+d.idea));return}
 if(d.iseg){iseg=d.iseg;hap('soft');render();return}
 if(d.bt){bt=d.bt;hap('soft');render();return}
 if(d.url){try{tg.openLink(d.url)}catch(err){window.open(d.url)}return}
 if(d.copy){const c=D.concepts[+d.copy];try{await navigator.clipboard.writeText(c.primary_text+'\n\n'+c.headline);toast('Скопійовано ✓');hap('medium')}catch(err){toast('Виділи текст і скопіюй')}return}
 if(d.dec){const a=O.actions.find(x=>x.id==d.id);const fire=()=>{done[d.id]=d.dec;save();try{tg.HapticFeedback.notificationOccurred(d.dec==='ok'?'success':'warning')}catch(err){}
   toast(d.dec==='ok'?'✓ ШІ виконує':'Залишаємо як є');render();
   if(D.bot&&tg?.initData){setTimeout(()=>{try{tg.openTelegramLink(`https://t.me/${D.bot}?start=${d.dec}_${D.slug}_${d.id}`)}catch(err){}},700)}};
  const msg=d.dec==='ok'?`${a.verb}: «${a.ad_name}»?`:'Залишити рекламу без змін?';
  if(tg?.initData&&tg.showConfirm){tg.showConfirm(msg,ok=>{if(ok)fire()})}else fire()}});
render();intro();
}</script></body></html>
